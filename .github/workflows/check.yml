name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src apps/collector/src packages/contracts/src pipelines/spark/src scripts tests
      - run: uv run pytest -n 6

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group spark
      - run: uv run --group spark mypy pipelines/spark/src tests
      - run: uv run --group spark pytest -m spark

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web

  cassandra:
    runs-on: ubuntu-latest
    services:
      cassandra:
        image: cassandra:5.0.5
        ports:
          - 9042:9042
        env:
          CASSANDRA_DC: datacenter1
          CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
          MAX_HEAP_SIZE: 512M
          HEAP_NEWSIZE: 128M
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE CLUSTER'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m cassandra
        env:
          CASSANDRA_TEST_HOST: 127.0.0.1
          CASSANDRA_TEST_DATACENTER: datacenter1

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
