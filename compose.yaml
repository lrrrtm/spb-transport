      API_CORS_ORIGINS: ${API_CORS_ORIGINS?API_CORS_ORIGINS must be set (may be empty)}
    ports:
      - "${API_EXTERNAL_PORT:?API_EXTERNAL_PORT is required}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    restart: unless-stopped

  cassandra:
    image: ${CASSANDRA_IMAGE:?CASSANDRA_IMAGE is required}
    hostname: cassandra
    ports:
      - "${CASSANDRA_PORT:?CASSANDRA_PORT is required}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:?CASSANDRA_CLUSTER_NAME is required}
      CASSANDRA_DC: ${CASSANDRA_DATACENTER:?CASSANDRA_DATACENTER is required}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:?CASSANDRA_HEAP_NEWSIZE is required}
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:?CASSANDRA_MAX_HEAP_SIZE is required}
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' localhost 9042 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  cassandra-init:
    image: ${CASSANDRA_IMAGE:?CASSANDRA_IMAGE is required}
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:?CASSANDRA_KEYSPACE is required}
      CASSANDRA_DATACENTER: ${CASSANDRA_DATACENTER:?CASSANDRA_DATACENTER is required}
      CASSANDRA_REPLICATION_FACTOR: ${CASSANDRA_REPLICATION_FACTOR:?CASSANDRA_REPLICATION_FACTOR is required}
      CASSANDRA_NATIVE_PORT: ${CASSANDRA_NATIVE_PORT:?CASSANDRA_NATIVE_PORT is required}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME-}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD-}
    volumes:
      - ./infra/cassandra/serving.cql.template:/schema/serving.cql.template:ro
    command:
      - bash
      - -ec
      - >-
        [[ "$${CASSANDRA_KEYSPACE}" =~ ^[a-z][a-z0-9_]*$ ]] ||
          { echo 'invalid CASSANDRA_KEYSPACE' >&2; exit 1; };
        [[ "$${CASSANDRA_DATACENTER}" =~ ^[A-Za-z0-9_-]+$ ]] ||
          { echo 'invalid CASSANDRA_DATACENTER' >&2; exit 1; };
        [[ "$${CASSANDRA_REPLICATION_FACTOR}" =~ ^[1-9][0-9]*$ ]] ||
          { echo 'invalid CASSANDRA_REPLICATION_FACTOR' >&2; exit 1; };
        if [[ -n "$${CASSANDRA_USERNAME}" || -n "$${CASSANDRA_PASSWORD}" ]]; then
          [[ -n "$${CASSANDRA_USERNAME}" && -n "$${CASSANDRA_PASSWORD}" ]] ||
            { echo 'Cassandra username and password must be set together' >&2; exit 1; };
          auth=(-u "$${CASSANDRA_USERNAME}" -p "$${CASSANDRA_PASSWORD}");
        else
          auth=();
        fi;
        sed -e "s/{{KEYSPACE}}/$${CASSANDRA_KEYSPACE}/g" -e "s/{{DATACENTER}}/$${CASSANDRA_DATACENTER}/g" -e "s/{{REPLICATION_FACTOR}}/$${CASSANDRA_REPLICATION_FACTOR}/g" /schema/serving.cql.template |
          cqlsh "$${auth[@]}" cassandra "$${CASSANDRA_NATIVE_PORT}"
    restart: "no"

volumes:
  kafka-data:
  hdfs-namenode-data:
  hdfs-datanode-data:
  cassandra-data:
