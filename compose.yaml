    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    image: spb-transport-api:local
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CASSANDRA_HOST: ${CASSANDRA_HOST:?CASSANDRA_HOST is required}
      CASSANDRA_NATIVE_PORT: ${CASSANDRA_NATIVE_PORT:?CASSANDRA_NATIVE_PORT is required}
      CASSANDRA_DATACENTER: ${CASSANDRA_DATACENTER:?CASSANDRA_DATACENTER is required}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:?CASSANDRA_KEYSPACE is required}
