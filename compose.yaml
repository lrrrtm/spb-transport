name: spb-transport

services:
  kafka:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE is required}
    hostname: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:?KAFKA_EXTERNAL_PORT is required}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:?KAFKA_EXTERNAL_PORT is required}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_MESSAGE_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:?KAFKA_MESSAGE_MAX_BYTES is required}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE is required}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      VEHICLE_POSITION_TOPIC: ${KAFKA_VEHICLE_POSITION_TOPIC:?KAFKA_VEHICLE_POSITION_TOPIC is required}
      VEHICLE_POSITION_PARTITIONS: ${KAFKA_VEHICLE_POSITION_PARTITIONS:?KAFKA_VEHICLE_POSITION_PARTITIONS is required}
      VEHICLE_ETA_TOPIC: ${KAFKA_VEHICLE_ETA_TOPIC:?KAFKA_VEHICLE_ETA_TOPIC is required}
      VEHICLE_ETA_PARTITIONS: ${KAFKA_VEHICLE_ETA_PARTITIONS:?KAFKA_VEHICLE_ETA_PARTITIONS is required}
      RAW_RESPONSE_TOPIC: ${KAFKA_RAW_RESPONSE_TOPIC:?KAFKA_RAW_RESPONSE_TOPIC is required}
      RAW_RESPONSE_PARTITIONS: ${KAFKA_RAW_RESPONSE_PARTITIONS:?KAFKA_RAW_RESPONSE_PARTITIONS is required}
      REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:?KAFKA_REPLICATION_FACTOR is required}
    command:
      - bash
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic "$${VEHICLE_POSITION_TOPIC}"
        --partitions "$${VEHICLE_POSITION_PARTITIONS}"
        --replication-factor "$${REPLICATION_FACTOR}" &&
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic "$${VEHICLE_ETA_TOPIC}"
        --partitions "$${VEHICLE_ETA_PARTITIONS}"
        --replication-factor "$${REPLICATION_FACTOR}" &&
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic "$${RAW_RESPONSE_TOPIC}"
        --partitions "$${RAW_RESPONSE_PARTITIONS}"
        --replication-factor "$${REPLICATION_FACTOR}"
    restart: "no"

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    image: spb-transport-collector:local
    environment:
      GTFS_REALTIME_BASE_URL: ${GTFS_REALTIME_BASE_URL:?GTFS_REALTIME_BASE_URL is required}
      GTFS_TLS_VERIFY: ${GTFS_TLS_VERIFY:?GTFS_TLS_VERIFY is required}
      GTFS_CA_BUNDLE: ${GTFS_CA_BUNDLE-}
      GTFS_CONNECT_TIMEOUT_SECONDS: ${GTFS_CONNECT_TIMEOUT_SECONDS:?GTFS_CONNECT_TIMEOUT_SECONDS is required}
      GTFS_READ_TIMEOUT_SECONDS: ${GTFS_READ_TIMEOUT_SECONDS:?GTFS_READ_TIMEOUT_SECONDS is required}
      GTFS_WRITE_TIMEOUT_SECONDS: ${GTFS_WRITE_TIMEOUT_SECONDS:?GTFS_WRITE_TIMEOUT_SECONDS is required}
      GTFS_POOL_TIMEOUT_SECONDS: ${GTFS_POOL_TIMEOUT_SECONDS:?GTFS_POOL_TIMEOUT_SECONDS is required}
      GTFS_RETRY_MAX_ATTEMPTS: ${GTFS_RETRY_MAX_ATTEMPTS:?GTFS_RETRY_MAX_ATTEMPTS is required}
      GTFS_RETRY_BACKOFF_BASE_SECONDS: ${GTFS_RETRY_BACKOFF_BASE_SECONDS:?GTFS_RETRY_BACKOFF_BASE_SECONDS is required}
      GTFS_RETRY_BACKOFF_MAX_SECONDS: ${GTFS_RETRY_BACKOFF_MAX_SECONDS:?GTFS_RETRY_BACKOFF_MAX_SECONDS is required}
      GTFS_RETRY_JITTER_SECONDS: ${GTFS_RETRY_JITTER_SECONDS:?GTFS_RETRY_JITTER_SECONDS is required}
      GTFS_VEHICLE_POLL_INTERVAL_SECONDS: ${GTFS_VEHICLE_POLL_INTERVAL_SECONDS:?GTFS_VEHICLE_POLL_INTERVAL_SECONDS is required}
      GTFS_VEHICLE_TRIPS_POLL_INTERVAL_SECONDS: ${GTFS_VEHICLE_TRIPS_POLL_INTERVAL_SECONDS:?GTFS_VEHICLE_TRIPS_POLL_INTERVAL_SECONDS is required}
      GTFS_VEHICLE_TRIPS_BATCH_SIZE: ${GTFS_VEHICLE_TRIPS_BATCH_SIZE:?GTFS_VEHICLE_TRIPS_BATCH_SIZE is required}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_VEHICLE_POSITION_TOPIC: ${KAFKA_VEHICLE_POSITION_TOPIC:?KAFKA_VEHICLE_POSITION_TOPIC is required}
      KAFKA_VEHICLE_ETA_TOPIC: ${KAFKA_VEHICLE_ETA_TOPIC:?KAFKA_VEHICLE_ETA_TOPIC is required}
      KAFKA_RAW_RESPONSE_TOPIC: ${KAFKA_RAW_RESPONSE_TOPIC:?KAFKA_RAW_RESPONSE_TOPIC is required}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:?KAFKA_CLIENT_ID is required}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:?KAFKA_LINGER_MS is required}
      KAFKA_MAX_BATCH_SIZE_BYTES: ${KAFKA_MAX_BATCH_SIZE_BYTES:?KAFKA_MAX_BATCH_SIZE_BYTES is required}
      KAFKA_MAX_REQUEST_SIZE_BYTES: ${KAFKA_MAX_REQUEST_SIZE_BYTES:?KAFKA_MAX_REQUEST_SIZE_BYTES is required}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:?KAFKA_REQUEST_TIMEOUT_MS is required}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  hdfs-namenode:
    image: spb-transport-hadoop:local
    build:
      context: infra/hadoop
      args:
        HADOOP_IMAGE: ${HADOOP_IMAGE:?HADOOP_IMAGE is required}
    hostname: hdfs-namenode
    user: root
    command:
      - bash
      - -c
      - >-
        chown hadoop:users /data/name;
        if [ ! -d /data/name/current ]; then
          runuser -u hadoop -- hdfs namenode -format -force -nonInteractive;
        fi;
        exec runuser -u hadoop -- hdfs namenode
    ports:
      - "${HDFS_NAMENODE_RPC_PORT:?HDFS_NAMENODE_RPC_PORT is required}:9000"
      - "${HDFS_NAMENODE_HTTP_PORT:?HDFS_NAMENODE_HTTP_PORT is required}:9870"
    volumes:
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-data:/data/name
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -fs hdfs://hdfs-namenode:9000 -ls / >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  hdfs-datanode:
    image: spb-transport-hadoop:local
    build:
      context: infra/hadoop
      args:
        HADOOP_IMAGE: ${HADOOP_IMAGE:?HADOOP_IMAGE is required}
    hostname: hdfs-datanode
    user: root
    command:
      - bash
      - -c
      - >-
        chown hadoop:users /data/data;
        exec runuser -u hadoop -- hdfs datanode
    ports:
      - "${HDFS_DATANODE_HTTP_PORT:?HDFS_DATANODE_HTTP_PORT is required}:9864"
    volumes:
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode-data:/data/data
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          hdfs dfsadmin -fs hdfs://hdfs-namenode:9000 -report | grep -q 'Live datanodes (1)' &&
          hdfs dfsadmin -fs hdfs://hdfs-namenode:9000 -safemode get | grep -q OFF
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-master:
    image: ${SPARK_IMAGE:?SPARK_IMAGE is required}
    build:
      context: .
      dockerfile: pipelines/spark/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "${SPARK_MASTER_PORT:?SPARK_MASTER_PORT is required}:7077"
      - "${SPARK_MASTER_WEB_PORT:?SPARK_MASTER_WEB_PORT is required}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-worker:
    image: ${SPARK_IMAGE:?SPARK_IMAGE is required}
    build:
      context: .
      dockerfile: pipelines/spark/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    hostname: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:?SPARK_WORKER_CORES is required}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:?SPARK_WORKER_MEMORY is required}
      SPARK_WORKER_WEBUI_PORT: 8081
    ports:
      - "${SPARK_WORKER_WEB_PORT:?SPARK_WORKER_WEB_PORT is required}:8081"
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-raw-archive:
    image: ${SPARK_IMAGE:?SPARK_IMAGE is required}
    build:
      context: .
      dockerfile: pipelines/spark/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --executor-cores
      - ${SPARK_EXECUTOR_CORES:?SPARK_EXECUTOR_CORES is required}
      - --conf
      - spark.cores.max=${SPARK_MAX_CORES_PER_JOB:?SPARK_MAX_CORES_PER_JOB is required}
      - --conf
      - spark.sql.shuffle.partitions=${SPARK_SHUFFLE_PARTITIONS:?SPARK_SHUFFLE_PARTITIONS is required}
      - /app/pipelines/spark/src/spb_transport_spark/raw_archive.py
    environment:
      PYSPARK_PYTHON: /app/.venv/bin/python
      PYTHONPATH: /app/pipelines/spark/src
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_RAW_RESPONSE_TOPIC: ${KAFKA_RAW_RESPONSE_TOPIC:?KAFKA_RAW_RESPONSE_TOPIC is required}
      SPARK_KAFKA_STARTING_OFFSETS: ${SPARK_KAFKA_STARTING_OFFSETS:?SPARK_KAFKA_STARTING_OFFSETS is required}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:?SPARK_TRIGGER_INTERVAL is required}
      HDFS_RAW_REALTIME_PATH: ${HDFS_RAW_REALTIME_PATH:?HDFS_RAW_REALTIME_PATH is required}
      HDFS_RAW_QUARANTINE_PATH: ${HDFS_RAW_QUARANTINE_PATH:?HDFS_RAW_QUARANTINE_PATH is required}
      HDFS_RAW_CHECKPOINT_PATH: ${HDFS_RAW_CHECKPOINT_PATH:?HDFS_RAW_CHECKPOINT_PATH is required}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hdfs-datanode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  spark-position-stream:
    image: ${SPARK_IMAGE:?SPARK_IMAGE is required}
    build:
      context: .
      dockerfile: pipelines/spark/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --executor-cores
      - ${SPARK_EXECUTOR_CORES:?SPARK_EXECUTOR_CORES is required}
      - --conf
      - spark.cores.max=${SPARK_MAX_CORES_PER_JOB:?SPARK_MAX_CORES_PER_JOB is required}
      - --conf
      - spark.sql.shuffle.partitions=${SPARK_SHUFFLE_PARTITIONS:?SPARK_SHUFFLE_PARTITIONS is required}
      - /app/pipelines/spark/src/spb_transport_spark/position_stream.py
    environment:
      PYSPARK_PYTHON: /app/.venv/bin/python
      PYTHONPATH: /app/pipelines/spark/src
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_VEHICLE_POSITION_TOPIC: ${KAFKA_VEHICLE_POSITION_TOPIC:?KAFKA_VEHICLE_POSITION_TOPIC is required}
      SPARK_KAFKA_STARTING_OFFSETS: ${SPARK_KAFKA_STARTING_OFFSETS:?SPARK_KAFKA_STARTING_OFFSETS is required}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:?SPARK_TRIGGER_INTERVAL is required}
      SPARK_POSITION_WATERMARK: ${SPARK_POSITION_WATERMARK:?SPARK_POSITION_WATERMARK is required}
      SPARK_POSITION_MAX_SOURCE_AGE_SECONDS: ${SPARK_POSITION_MAX_SOURCE_AGE_SECONDS:?SPARK_POSITION_MAX_SOURCE_AGE_SECONDS is required}
      SPARK_POSITION_MAX_FUTURE_SKEW_SECONDS: ${SPARK_POSITION_MAX_FUTURE_SKEW_SECONDS:?SPARK_POSITION_MAX_FUTURE_SKEW_SECONDS is required}
      HDFS_POSITION_PROCESSED_PATH: ${HDFS_POSITION_PROCESSED_PATH:?HDFS_POSITION_PROCESSED_PATH is required}
      HDFS_POSITION_QUARANTINE_PATH: ${HDFS_POSITION_QUARANTINE_PATH:?HDFS_POSITION_QUARANTINE_PATH is required}
      HDFS_POSITION_CHECKPOINT_PATH: ${HDFS_POSITION_CHECKPOINT_PATH:?HDFS_POSITION_CHECKPOINT_PATH is required}
      CASSANDRA_HOST: ${CASSANDRA_HOST:?CASSANDRA_HOST is required}
      CASSANDRA_NATIVE_PORT: ${CASSANDRA_NATIVE_PORT:?CASSANDRA_NATIVE_PORT is required}
      CASSANDRA_DATACENTER: ${CASSANDRA_DATACENTER:?CASSANDRA_DATACENTER is required}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:?CASSANDRA_KEYSPACE is required}
      CASSANDRA_LATEST_TTL_SECONDS: ${CASSANDRA_LATEST_TTL_SECONDS:?CASSANDRA_LATEST_TTL_SECONDS is required}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME-}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hdfs-datanode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  spark-eta-stream:
    image: ${SPARK_IMAGE:?SPARK_IMAGE is required}
    build:
      context: .
      dockerfile: pipelines/spark/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --executor-cores
      - ${SPARK_EXECUTOR_CORES:?SPARK_EXECUTOR_CORES is required}
      - --conf
      - spark.cores.max=${SPARK_MAX_CORES_PER_JOB:?SPARK_MAX_CORES_PER_JOB is required}
      - --conf
      - spark.sql.shuffle.partitions=${SPARK_SHUFFLE_PARTITIONS:?SPARK_SHUFFLE_PARTITIONS is required}
      - /app/pipelines/spark/src/spb_transport_spark/eta_stream.py
    environment:
      PYSPARK_PYTHON: /app/.venv/bin/python
      PYTHONPATH: /app/pipelines/spark/src
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      KAFKA_VEHICLE_ETA_TOPIC: ${KAFKA_VEHICLE_ETA_TOPIC:?KAFKA_VEHICLE_ETA_TOPIC is required}
      SPARK_KAFKA_STARTING_OFFSETS: ${SPARK_KAFKA_STARTING_OFFSETS:?SPARK_KAFKA_STARTING_OFFSETS is required}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:?SPARK_TRIGGER_INTERVAL is required}
      SPARK_ETA_WATERMARK: ${SPARK_ETA_WATERMARK:?SPARK_ETA_WATERMARK is required}
      HDFS_ETA_HISTORY_PATH: ${HDFS_ETA_HISTORY_PATH:?HDFS_ETA_HISTORY_PATH is required}
      HDFS_ETA_QUARANTINE_PATH: ${HDFS_ETA_QUARANTINE_PATH:?HDFS_ETA_QUARANTINE_PATH is required}
      HDFS_ETA_CHECKPOINT_PATH: ${HDFS_ETA_CHECKPOINT_PATH:?HDFS_ETA_CHECKPOINT_PATH is required}
      CASSANDRA_HOST: ${CASSANDRA_HOST:?CASSANDRA_HOST is required}
      CASSANDRA_NATIVE_PORT: ${CASSANDRA_NATIVE_PORT:?CASSANDRA_NATIVE_PORT is required}
      CASSANDRA_DATACENTER: ${CASSANDRA_DATACENTER:?CASSANDRA_DATACENTER is required}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:?CASSANDRA_KEYSPACE is required}
      CASSANDRA_LATEST_TTL_SECONDS: ${CASSANDRA_LATEST_TTL_SECONDS:?CASSANDRA_LATEST_TTL_SECONDS is required}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME-}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hdfs-datanode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  spark-static-gtfs:
    profiles: ["ingestion"]
    image: ${SPARK_IMAGE:?SPARK_IMAGE is required}
    build:
      context: .
      dockerfile: pipelines/spark/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --executor-cores
      - ${SPARK_EXECUTOR_CORES:?SPARK_EXECUTOR_CORES is required}
      - --conf
      - spark.cores.max=${SPARK_MAX_CORES_PER_JOB:?SPARK_MAX_CORES_PER_JOB is required}
      - --conf
      - spark.sql.shuffle.partitions=${SPARK_SHUFFLE_PARTITIONS:?SPARK_SHUFFLE_PARTITIONS is required}
      - /app/pipelines/spark/src/spb_transport_spark/static_gtfs.py
    environment:
      PYSPARK_PYTHON: /app/.venv/bin/python
      PYTHONPATH: /app/pipelines/spark/src
      GTFS_STATIC_URL: ${GTFS_STATIC_URL:?GTFS_STATIC_URL is required}
      GTFS_TLS_VERIFY: ${GTFS_TLS_VERIFY:?GTFS_TLS_VERIFY is required}
      GTFS_CA_BUNDLE: ${GTFS_CA_BUNDLE-}
      GTFS_STATIC_TIMEOUT_SECONDS: ${GTFS_STATIC_TIMEOUT_SECONDS:?GTFS_STATIC_TIMEOUT_SECONDS is required}
      GTFS_STATIC_RETRY_MAX_ATTEMPTS: ${GTFS_STATIC_RETRY_MAX_ATTEMPTS:?GTFS_STATIC_RETRY_MAX_ATTEMPTS is required}
      GTFS_STATIC_RETRY_BACKOFF_SECONDS: ${GTFS_STATIC_RETRY_BACKOFF_SECONDS:?GTFS_STATIC_RETRY_BACKOFF_SECONDS is required}
      GTFS_STATIC_MAX_DOWNLOAD_BYTES: ${GTFS_STATIC_MAX_DOWNLOAD_BYTES:?GTFS_STATIC_MAX_DOWNLOAD_BYTES is required}
      GTFS_STATIC_MAX_UNCOMPRESSED_BYTES: ${GTFS_STATIC_MAX_UNCOMPRESSED_BYTES:?GTFS_STATIC_MAX_UNCOMPRESSED_BYTES is required}
      HDFS_STATIC_RAW_PATH: ${HDFS_STATIC_RAW_PATH:?HDFS_STATIC_RAW_PATH is required}
      HDFS_STATIC_PROCESSED_PATH: ${HDFS_STATIC_PROCESSED_PATH:?HDFS_STATIC_PROCESSED_PATH is required}
      HDFS_STATIC_STAGING_PATH: ${HDFS_STATIC_STAGING_PATH:?HDFS_STATIC_STAGING_PATH is required}
    depends_on:
      hdfs-datanode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    restart: "no"

  spark-route-matching:
    profiles: ["batch"]
    image: ${SPARK_IMAGE:?SPARK_IMAGE is required}
    build:
      context: .
      dockerfile: pipelines/spark/Dockerfile
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST-}
    # Run-specific arguments are appended by `docker compose run`:
    # --event-date YYYY-MM-DD --static-version <sha256>
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --executor-cores
      - ${SPARK_EXECUTOR_CORES:?SPARK_EXECUTOR_CORES is required}
      - --conf
      - spark.cores.max=${SPARK_MAX_CORES_PER_JOB:?SPARK_MAX_CORES_PER_JOB is required}
      - --conf
      - spark.sql.shuffle.partitions=${SPARK_SHUFFLE_PARTITIONS:?SPARK_SHUFFLE_PARTITIONS is required}
      - --conf
      - spark.executorEnv.PYTHONPATH=/app/pipelines/spark/src
      - /app/pipelines/spark/src/spb_transport_spark/route_match_batch.py
    command: []
    environment:
      PYSPARK_PYTHON: /app/.venv/bin/python
      PYTHONPATH: /app/pipelines/spark/src
      HDFS_POSITION_PROCESSED_PATH: ${HDFS_POSITION_PROCESSED_PATH:?HDFS_POSITION_PROCESSED_PATH is required}
      HDFS_STATIC_PROCESSED_PATH: ${HDFS_STATIC_PROCESSED_PATH:?HDFS_STATIC_PROCESSED_PATH is required}
      HDFS_ROUTE_MATCHES_PATH: ${HDFS_ROUTE_MATCHES_PATH:?HDFS_ROUTE_MATCHES_PATH is required}
      ROUTE_MATCH_MAX_OFFSET_M: ${ROUTE_MATCH_MAX_OFFSET_M:?ROUTE_MATCH_MAX_OFFSET_M is required}
      ROUTE_MATCH_GPS_SIGMA_M: ${ROUTE_MATCH_GPS_SIGMA_M:?ROUTE_MATCH_GPS_SIGMA_M is required}
      ROUTE_MATCH_OUTLIER_OFFSET_M: ${ROUTE_MATCH_OUTLIER_OFFSET_M:?ROUTE_MATCH_OUTLIER_OFFSET_M is required}
      ROUTE_MATCH_BEARING_WEIGHT: ${ROUTE_MATCH_BEARING_WEIGHT:?ROUTE_MATCH_BEARING_WEIGHT is required}
      ROUTE_MATCH_BEARING_MIN_SPEED: ${ROUTE_MATCH_BEARING_MIN_SPEED:?ROUTE_MATCH_BEARING_MIN_SPEED is required}
      ROUTE_MATCH_MAX_BACKTRACK_M: ${ROUTE_MATCH_MAX_BACKTRACK_M:?ROUTE_MATCH_MAX_BACKTRACK_M is required}
      ROUTE_MATCH_MAX_SPEED_MPS: ${ROUTE_MATCH_MAX_SPEED_MPS:?ROUTE_MATCH_MAX_SPEED_MPS is required}
      ROUTE_MATCH_TRANSITION_BETA_M: ${ROUTE_MATCH_TRANSITION_BETA_M:?ROUTE_MATCH_TRANSITION_BETA_M is required}
      ROUTE_MATCH_SWITCH_COST: ${ROUTE_MATCH_SWITCH_COST:?ROUTE_MATCH_SWITCH_COST is required}
      ROUTE_MATCH_TERMINAL_RESTART_COST: ${ROUTE_MATCH_TERMINAL_RESTART_COST:?ROUTE_MATCH_TERMINAL_RESTART_COST is required}
      ROUTE_MATCH_OFF_ROUTE_TRANSITION_COST: ${ROUTE_MATCH_OFF_ROUTE_TRANSITION_COST:?ROUTE_MATCH_OFF_ROUTE_TRANSITION_COST is required}
      ROUTE_MATCH_TERMINAL_ZONE_M: ${ROUTE_MATCH_TERMINAL_ZONE_M:?ROUTE_MATCH_TERMINAL_ZONE_M is required}
      ROUTE_MATCH_MAX_GAP_SECONDS: ${ROUTE_MATCH_MAX_GAP_SECONDS:?ROUTE_MATCH_MAX_GAP_SECONDS is required}
      ROUTE_MATCH_MIN_CONFIDENCE: ${ROUTE_MATCH_MIN_CONFIDENCE:?ROUTE_MATCH_MIN_CONFIDENCE is required}
    depends_on:
      hdfs-datanode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    restart: "no"

  cassandra:
    image: ${CASSANDRA_IMAGE:?CASSANDRA_IMAGE is required}
    hostname: cassandra
    ports:
      - "${CASSANDRA_PORT:?CASSANDRA_PORT is required}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:?CASSANDRA_CLUSTER_NAME is required}
      CASSANDRA_DC: ${CASSANDRA_DATACENTER:?CASSANDRA_DATACENTER is required}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:?CASSANDRA_HEAP_NEWSIZE is required}
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:?CASSANDRA_MAX_HEAP_SIZE is required}
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' localhost 9042 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  cassandra-init:
    image: ${CASSANDRA_IMAGE:?CASSANDRA_IMAGE is required}
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:?CASSANDRA_KEYSPACE is required}
      CASSANDRA_DATACENTER: ${CASSANDRA_DATACENTER:?CASSANDRA_DATACENTER is required}
      CASSANDRA_REPLICATION_FACTOR: ${CASSANDRA_REPLICATION_FACTOR:?CASSANDRA_REPLICATION_FACTOR is required}
      CASSANDRA_NATIVE_PORT: ${CASSANDRA_NATIVE_PORT:?CASSANDRA_NATIVE_PORT is required}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME-}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD-}
    volumes:
      - ./infra/cassandra/serving.cql.template:/schema/serving.cql.template:ro
    command:
      - bash
      - -ec
      - >-
        [[ "$${CASSANDRA_KEYSPACE}" =~ ^[a-z][a-z0-9_]*$ ]] ||
          { echo 'invalid CASSANDRA_KEYSPACE' >&2; exit 1; };
        [[ "$${CASSANDRA_DATACENTER}" =~ ^[A-Za-z0-9_-]+$ ]] ||
          { echo 'invalid CASSANDRA_DATACENTER' >&2; exit 1; };
        [[ "$${CASSANDRA_REPLICATION_FACTOR}" =~ ^[1-9][0-9]*$ ]] ||
          { echo 'invalid CASSANDRA_REPLICATION_FACTOR' >&2; exit 1; };
        if [[ -n "$${CASSANDRA_USERNAME}" || -n "$${CASSANDRA_PASSWORD}" ]]; then
          [[ -n "$${CASSANDRA_USERNAME}" && -n "$${CASSANDRA_PASSWORD}" ]] ||
            { echo 'Cassandra username and password must be set together' >&2; exit 1; };
          auth=(-u "$${CASSANDRA_USERNAME}" -p "$${CASSANDRA_PASSWORD}");
        else
          auth=();
        fi;
        sed -e "s/{{KEYSPACE}}/$${CASSANDRA_KEYSPACE}/g" -e "s/{{DATACENTER}}/$${CASSANDRA_DATACENTER}/g" -e "s/{{REPLICATION_FACTOR}}/$${CASSANDRA_REPLICATION_FACTOR}/g" /schema/serving.cql.template |
          cqlsh "$${auth[@]}" cassandra "$${CASSANDRA_NATIVE_PORT}"
    restart: "no"

volumes:
  kafka-data:
  hdfs-namenode-data:
  hdfs-datanode-data:
  cassandra-data:
