      API_MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE:?API_MAX_PAGE_SIZE is required}
      API_HISTORY_MAX_RANGE_HOURS: ${API_HISTORY_MAX_RANGE_HOURS:?API_HISTORY_MAX_RANGE_HOURS is required}
