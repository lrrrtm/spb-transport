[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.14,<1",
  "types-protobuf>=6.32,<7",
]
# Local Spark for integration tests of batch jobs; Spark images bring their own PySpark.
spark = ["pyspark==3.5.9"]

[tool.uv.workspace]
members = ["apps/api", "apps/collector", "packages/contracts", "pipelines/spark"]

[tool.pytest.ini_options]
addopts = "-q -m 'not spark'"
markers = ["spark: needs local PySpark and Java 17 (make test-spark)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*", "cassandra", "cassandra.*"]
ignore_missing_imports = true
