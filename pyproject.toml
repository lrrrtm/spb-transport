[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "spb-transport-bootstrap"
version = "0.1.0"
description = "Shared contracts and bootstrap tooling for SPB transport analytics"
requires-python = ">=3.13,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.setuptools]
package-dir = {"" = "packages/contracts/src"}

[tool.setuptools.packages.find]
where = ["packages/contracts/src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
