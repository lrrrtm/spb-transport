[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.uv.workspace]
members = ["apps/collector", "packages/contracts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
